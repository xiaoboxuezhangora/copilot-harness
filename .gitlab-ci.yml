image: node:22-alpine

workflow:
  rules:
    - if: '$ENABLE_GITLAB_CI == "1"'
      when: always
    - when: never

stages:
  - lint
  - typecheck
  - test

default:
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --ignore-scripts

format-check:
  stage: lint
  script:
    - pnpm format:check

lint:
  stage: lint
  script:
    - pnpm lint

typecheck:
  stage: typecheck
  script:
    - pnpm typecheck

test:
  stage: test
  script:
    - pnpm test
